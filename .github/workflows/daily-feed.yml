name: Manual Free RSS Career Feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-feed:
    name: Collect and send free category briefs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Log KST workflow start
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow start KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Prepare report directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/candidates reports/briefs

      - name: Collect feed candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect-feeds.py

      - name: Render free briefs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render-brief.py

      - name: Render daily overview
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render-overview.py

      - name: Send legacy free category briefs to Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_DAILY_OVERVIEW: ${{ secrets.DISCORD_WEBHOOK_DAILY_OVERVIEW }}
          DISCORD_WEBHOOK_AI_NEWS: ${{ secrets.DISCORD_WEBHOOK_AI_NEWS }}
          DISCORD_WEBHOOK_BACKEND_NEWS: ${{ secrets.DISCORD_WEBHOOK_BACKEND_NEWS }}
          DISCORD_WEBHOOK_SECURITY_ALERTS: ${{ secrets.DISCORD_WEBHOOK_SECURITY_ALERTS }}
        run: |
          set -euo pipefail
          python3 scripts/send-category-briefs.py --category daily-overview --include-disabled
          python3 scripts/send-category-briefs.py --category ai-news --include-disabled
          python3 scripts/send-category-briefs.py --category backend-news --include-disabled
          python3 scripts/send-category-briefs.py --category security-alerts --include-disabled

      - name: Upload candidates and briefs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-feed-free-${{ github.run_id }}
          path: |
            reports/candidates
            reports/briefs
          if-no-files-found: warn
