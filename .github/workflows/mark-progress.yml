name: Mark Progress

on:
  workflow_dispatch:
    inputs:
      item_type:
        description: "Completed item type"
        required: true
        type: choice
        options:
          - backend
          - ps
      item_id:
        description: "Completed ID shown in Backend Daily"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: career-feed-progress-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  mark:
    name: Mark item complete
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Update progress
        env:
          ITEM_TYPE: ${{ inputs.item_type }}
          ITEM_ID: ${{ inputs.item_id }}
        run: python3 scripts/mark_progress.py "${ITEM_TYPE}" "${ITEM_ID}"

      - name: Commit progress
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if git diff --quiet -- data/progress.json; then
            echo "No progress change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git commit -m "chore(progress): mark item complete"
          git push origin "HEAD:${DEFAULT_BRANCH}"
