name: Backend Daily Brief

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate artifacts without sending Discord"
        required: false
        type: boolean
        default: true
      force_send:
        description: "Send even if today's delivery lock exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: career-feed-backend-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-locales:
    name: Prepare enabled locales
    runs-on: ubuntu-latest
    outputs:
      locales_json: ${{ steps.locales.outputs.locales_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve enabled locales
        id: locales
        shell: bash
        env:
          CAREER_FEED_ENABLED_LOCALES: ${{ vars.CAREER_FEED_ENABLED_LOCALES }}
          CAREER_FEED_DEFAULT_LOCALE: ${{ vars.CAREER_FEED_DEFAULT_LOCALE }}
        run: |
          set -euo pipefail
          python3 scripts/locale_config.py matrix

  build:
    name: Generate and send backend daily brief (${{ matrix.locale }})
    needs: prepare-locales
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJson(needs.prepare-locales.outputs.locales_json) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Check runtime schedule
        id: runtime_gate
        shell: bash
        env:
          CAREER_FEED_TIMEZONE: ${{ vars.CAREER_FEED_TIMEZONE }}
          CAREER_FEED_BACKEND_DAILY_TIME: ${{ vars.CAREER_FEED_BACKEND_DAILY_TIME }}
          CAREER_FEED_NEWS_DAILY_TIME: ${{ vars.CAREER_FEED_NEWS_DAILY_TIME }}
          CAREER_FEED_CAREER_WEEKLY_DAY: ${{ vars.CAREER_FEED_CAREER_WEEKLY_DAY }}
          CAREER_FEED_CAREER_WEEKLY_TIME: ${{ vars.CAREER_FEED_CAREER_WEEKLY_TIME }}
          CAREER_FEED_OSS_RECENT_DAYS: ${{ vars.CAREER_FEED_OSS_RECENT_DAYS }}
          CAREER_FEED_SCHEDULE_ENABLED: ${{ vars.CAREER_FEED_SCHEDULE_ENABLED }}
          CAREER_FEED_DISCORD_DELIVERY_ENABLED: ${{ vars.CAREER_FEED_DISCORD_DELIVERY_ENABLED }}
          CAREER_FEED_ENABLED_LOCALES: ${{ vars.CAREER_FEED_ENABLED_LOCALES }}
          CAREER_FEED_DEFAULT_LOCALE: ${{ vars.CAREER_FEED_DEFAULT_LOCALE }}
          CAREER_FEED_SEARCH_PROVIDERS_KO_KR: ${{ vars.CAREER_FEED_SEARCH_PROVIDERS_KO_KR }}
          CAREER_FEED_SEARCH_PROVIDERS_EN_US: ${{ vars.CAREER_FEED_SEARCH_PROVIDERS_EN_US }}
        run: |
          set -euo pipefail
          python3 scripts/should-run-now.py --workflow backend_daily

      - name: Resolve locale runtime paths
        id: locale
        shell: bash
        env:
          LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          python3 scripts/locale_config.py paths --locale "${LOCALE}" --feed backend-daily

      - name: Prepare report directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "${{ steps.locale.outputs.candidate_dir }}" \
            "${{ steps.locale.outputs.brief_dir }}" \
            "${{ steps.locale.outputs.ops_dir }}/delivery-locks"

      - name: Set run context
        id: context
        if: steps.runtime_gate.outputs.should_run == 'true'
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          INPUT_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || false }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUNTIME_TIMEZONE: ${{ steps.runtime_gate.outputs.timezone }}
          RUNTIME_LOCAL_NOW: ${{ steps.runtime_gate.outputs.local_now }}
          RUNTIME_LOCAL_DATE: ${{ steps.runtime_gate.outputs.local_date }}
          LOCALE: ${{ matrix.locale }}
          OPS_DIR: ${{ steps.locale.outputs.ops_dir }}
        run: |
          set -euo pipefail

          kst_now="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          kst_date="$(TZ=Asia/Seoul date '+%Y-%m-%d')"
          delivery_lock_key="career-feed-${LOCALE}-backend-daily-sent-${RUNTIME_LOCAL_DATE}"
          lock_marker="${OPS_DIR}/delivery-locks/backend-daily-sent-${RUNTIME_LOCAL_DATE}.lock"

          echo "event_name=${EVENT_NAME}"
          echo "event_schedule=${EVENT_SCHEDULE:-}"
          echo "runtime_timezone=${RUNTIME_TIMEZONE}"
          echo "runtime_local_now=${RUNTIME_LOCAL_NOW}"
          echo "kst_now=${kst_now}"
          echo "dry_run=${INPUT_DRY_RUN}"
          echo "force_send=${INPUT_FORCE_SEND}"

          {
            echo "runtime_timezone=${RUNTIME_TIMEZONE}"
            echo "runtime_local_now=${RUNTIME_LOCAL_NOW}"
            echo "runtime_local_date=${RUNTIME_LOCAL_DATE}"
            echo "kst_now=${kst_now}"
            echo "kst_date=${kst_date}"
            echo "locale=${LOCALE}"
            echo "dry_run=${INPUT_DRY_RUN}"
            echo "force_send=${INPUT_FORCE_SEND}"
            echo "delivery_lock_key=${delivery_lock_key}"
            echo "lock_marker=${lock_marker}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore Backend Daily delivery lock
        id: delivery-lock
        if: steps.runtime_gate.outputs.should_run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.context.outputs.lock_marker }}
          key: ${{ steps.context.outputs.delivery_lock_key }}

      - name: Decide delivery action
        id: delivery
        shell: bash
        env:
          RUNTIME_SHOULD_RUN: ${{ steps.runtime_gate.outputs.should_run }}
          RUNTIME_REASON: ${{ steps.runtime_gate.outputs.reason }}
          DISCORD_DELIVERY_ENABLED: ${{ steps.runtime_gate.outputs.discord_delivery_enabled }}
          DRY_RUN: ${{ steps.context.outputs.dry_run }}
          FORCE_SEND: ${{ steps.context.outputs.force_send }}
          LOCK_HIT: ${{ steps.delivery-lock.outputs.cache-hit == 'true' }}
          LOCALE: ${{ matrix.locale }}
          OPS_DIR: ${{ steps.locale.outputs.ops_dir }}
          DISCORD_WEBHOOK_KO_KR_BACKEND_DAILY: ${{ secrets.DISCORD_WEBHOOK_KO_KR_BACKEND_DAILY }}
          DISCORD_WEBHOOK_EN_US_BACKEND_DAILY: ${{ secrets.DISCORD_WEBHOOK_EN_US_BACKEND_DAILY }}
          DISCORD_WEBHOOK_KR_TECH_DAILY: ${{ secrets.DISCORD_WEBHOOK_KR_TECH_DAILY }}
          DISCORD_WEBHOOK_CAREER_FEED: ${{ secrets.DISCORD_WEBHOOK_CAREER_FEED }}
        run: |
          set -euo pipefail

          runtime_should_run="${RUNTIME_SHOULD_RUN:-false}"
          runtime_reason="${RUNTIME_REASON:-not_scheduled}"
          dry_run="${DRY_RUN:-false}"
          force_send="${FORCE_SEND:-false}"
          lock_hit="${LOCK_HIT:-false}"
          discord_delivery_enabled="${DISCORD_DELIVERY_ENABLED:-false}"
          should_generate="true"
          should_send="true"
          skip_reason=""
          webhook_secret_name=""
          webhook_available="false"

          if [ "${LOCALE}" = "ko-KR" ]; then
            webhook_secret_name="DISCORD_WEBHOOK_KO_KR_BACKEND_DAILY or DISCORD_WEBHOOK_KR_TECH_DAILY or DISCORD_WEBHOOK_CAREER_FEED"
            if [ -n "${DISCORD_WEBHOOK_KO_KR_BACKEND_DAILY:-${DISCORD_WEBHOOK_KR_TECH_DAILY:-${DISCORD_WEBHOOK_CAREER_FEED:-}}}" ]; then
              webhook_available="true"
            fi
          elif [ "${LOCALE}" = "en-US" ]; then
            webhook_secret_name="DISCORD_WEBHOOK_EN_US_BACKEND_DAILY or DISCORD_WEBHOOK_CAREER_FEED"
            if [ -n "${DISCORD_WEBHOOK_EN_US_BACKEND_DAILY:-${DISCORD_WEBHOOK_CAREER_FEED:-}}" ]; then
              webhook_available="true"
            fi
          fi

          if [ "${runtime_should_run}" != "true" ]; then
            should_generate="false"
            should_send="false"
            skip_reason="runtime_gate:${runtime_reason}"
          elif [ "${dry_run}" = "true" ]; then
            should_send="false"
            skip_reason="dry_run"
          elif [ "${discord_delivery_enabled}" != "true" ]; then
            should_send="false"
            skip_reason="discord_delivery_disabled"
          elif [ "${lock_hit}" = "true" ] && [ "${force_send}" != "true" ]; then
            should_generate="false"
            should_send="false"
            skip_reason="delivery_lock_hit"
          elif [ "${webhook_available}" != "true" ]; then
            should_send="false"
            skip_reason="webhook_missing:${webhook_secret_name}"
          fi

          echo "should_generate=${should_generate}" >> "${GITHUB_OUTPUT}"
          echo "should_send=${should_send}" >> "${GITHUB_OUTPUT}"
          echo "skip_reason=${skip_reason}" >> "${GITHUB_OUTPUT}"

          if [ "${should_send}" != "true" ]; then
            {
              echo "# Backend Daily Discord send skipped"
              echo
              echo "- reason: ${skip_reason}"
              echo "- runtime_should_run: ${runtime_should_run}"
              echo "- runtime_reason: ${runtime_reason}"
              echo "- discord_delivery_enabled: ${discord_delivery_enabled}"
              echo "- delivery_lock_hit: ${lock_hit}"
              echo "- force_send: ${force_send}"
              echo "- dry_run: ${dry_run}"
              echo "- locale: ${LOCALE}"
            } > "${OPS_DIR}/backend-daily-discord-skip.md"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check required secrets
        id: check-secrets
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHOULD_GENERATE: ${{ steps.delivery.outputs.should_generate }}
        run: |
          set -euo pipefail

          missing=()
          if [ "${SHOULD_GENERATE}" = "true" ] && [ -z "${OPENAI_API_KEY}" ]; then
            missing+=("OPENAI_API_KEY")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Collect backend daily candidates
        id: collect
        if: steps.delivery.outputs.should_generate == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAREER_FEED_OSS_RECENT_DAYS: ${{ vars.CAREER_FEED_OSS_RECENT_DAYS }}
          CAREER_FEED_SEARCH_PROVIDERS_KO_KR: ${{ vars.CAREER_FEED_SEARCH_PROVIDERS_KO_KR }}
          CAREER_FEED_SEARCH_PROVIDERS_EN_US: ${{ vars.CAREER_FEED_SEARCH_PROVIDERS_EN_US }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          LOCALE: ${{ matrix.locale }}
          CONFIG_FILE: ${{ steps.locale.outputs.config_file }}
          CANDIDATE_DIR: ${{ steps.locale.outputs.candidate_dir }}
        run: |
          set -euo pipefail
          python3 scripts/collect-kr-feeds.py \
            --mode daily-backend \
            --locale "${LOCALE}" \
            --config "${CONFIG_FILE}" \
            --output-dir "${CANDIDATE_DIR}"

      - name: Prepare runtime prompt
        id: prepare
        if: steps.delivery.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail

          kst_now="${{ steps.context.outputs.kst_now }}"
          runtime_prompt="${RUNNER_TEMP}/backend-daily-${{ matrix.locale }}-${GITHUB_RUN_ID}.md"
          report_file="${{ steps.locale.outputs.report_file }}"

          KST_NOW="${kst_now}" \
          RUNTIME_PROMPT="${runtime_prompt}" \
          LOCALE="${{ matrix.locale }}" \
          PROMPT_FILE="${{ steps.locale.outputs.prompt_file }}" \
          REPORT_FILE="${report_file}" \
          CANDIDATE_DIR="${{ steps.locale.outputs.candidate_dir }}" \
          AUDIENCE_FILE="${{ steps.locale.outputs.audience_file }}" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ["PROMPT_FILE"])
          destination = Path(os.environ["RUNTIME_PROMPT"])
          prompt = source.read_text(encoding="utf-8")
          prompt = prompt.replace("{{KST_NOW}}", os.environ["KST_NOW"])
          candidate_dir = Path(os.environ["CANDIDATE_DIR"])
          locale = os.environ["LOCALE"]
          report_file = os.environ["REPORT_FILE"]
          audience_file = os.environ["AUDIENCE_FILE"]
          runtime = prompt + "\n\n## Runtime candidate files\n\n"
          runtime += f"- locale: `{locale}`\n"
          runtime += f"- `{candidate_dir / 'spring-study-topic.json'}`\n"
          runtime += f"- `{candidate_dir / 'ps-weekly-routine.json'}`\n"
          runtime += f"- `{candidate_dir / 'kr-oss-contribution-opportunities.json'}`\n"
          runtime += f"- `{candidate_dir / 'backend-practical-knowledge.json'}`\n"
          runtime += f"- `{candidate_dir / 'cs-core-daily-topic.json'}`\n"
          runtime += f"- `{candidate_dir / 'backend-term-daily.json'}`\n"
          runtime += f"- `{audience_file}`\n"
          if locale == "ko-KR":
              runtime += "\n`ps-weekly-routine.json`을 알고리즘 루틴의 primary 후보로 사용한다.\n"
              runtime += "`spring-study-topic.json`은 1번 Spring Boot/JVM 학습 섹션의 primary 입력으로 사용하되, 후보가 부실하면 프롬프트의 보강 규칙을 따른다.\n"
              runtime += "`backend-practical-knowledge.json`의 today 후보를 4번 주니어 백엔드 실무지식의 primary 입력으로 사용하되, 후보가 부실하면 프롬프트의 보강 규칙을 따른다.\n"
              runtime += "`cs-core-daily-topic.json`과 `backend-term-daily.json`의 today 후보를 5번 오늘의 CS Core & 백엔드 용어 섹션의 primary 입력으로 사용한다.\n"
              runtime += "`## 오늘 " "할 일` 섹션은 출력하지 않는다.\n"
          runtime += "\n## Runtime output\n\n"
          runtime += f"- Write the final Markdown only to `{report_file}`.\n"
          runtime += "- Do not modify candidate JSON, progress, config, workflow, or script files during generation.\n"
          runtime += "- Do not output secret values or webhook URLs.\n"
          destination.write_text(runtime, encoding="utf-8")
          PY

          {
            echo "runtime_prompt=${runtime_prompt}"
            echo "report_file=${report_file}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate backend daily Markdown brief
        id: generate-primary
        if: steps.delivery.outputs.should_generate == 'true'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prepare.outputs.runtime_prompt }}
          output-file: ${{ steps.locale.outputs.codex_summary_file }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--model","gpt-5.4-mini","-c","model_reasoning_effort=\"low\""]'

      - name: Retry backend daily Markdown generation
        id: generate-retry
        if: steps.delivery.outputs.should_generate == 'true' && steps.generate-primary.outcome == 'failure'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prepare.outputs.runtime_prompt }}
          output-file: ${{ steps.locale.outputs.codex_summary_file }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--model","gpt-5.4-mini","-c","model_reasoning_effort=\"low\""]'

      - name: Fail if backend daily generation failed
        id: generation-status
        if: steps.delivery.outputs.should_generate == 'true' && steps.generate-primary.outcome != 'success' && steps.generate-retry.outcome != 'success'
        shell: bash
        run: |
          echo "Backend daily generation failed after retry." >&2
          exit 1

      - name: Validate backend daily Markdown
        id: validate
        if: steps.delivery.outputs.should_generate == 'true'
        shell: bash
        env:
          REPORT_FILE: ${{ steps.prepare.outputs.report_file }}
          CANDIDATE_DIR: ${{ steps.locale.outputs.candidate_dir }}
          VALIDATION_REPORT: ${{ steps.locale.outputs.validation_report }}
          LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${VALIDATION_REPORT}")"

          validation_log="$(mktemp)"
          validation_status="passed"
          validation_error=""
          exit_code=0

          set +e
          python3 scripts/validate-career-feed-brief.py \
            "${REPORT_FILE}" \
            --type daily-tech \
            --locale "${LOCALE}" \
            --candidates-dir "${CANDIDATE_DIR}" > "${validation_log}" 2>&1
          exit_code="$?"
          set -e

          if [ "${exit_code}" -ne 0 ]; then
            validation_status="failed"
            validation_error="$(tail -n 1 "${validation_log}" | sed 's/[[:cntrl:]]//g')"
          fi

          {
            echo "# Backend Daily Validation Report"
            echo
            echo "- status: ${validation_status}"
            echo "- report_file: ${REPORT_FILE}"
            if [ -n "${validation_error}" ]; then
              echo "- error: ${validation_error}"
            fi
            echo
            echo "## Output"
            echo
            echo '```text'
            tail -n 30 "${validation_log}" || true
            echo '```'
          } > "${VALIDATION_REPORT}"

          if [ "${exit_code}" -ne 0 ]; then
            cat "${VALIDATION_REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          cat "${validation_log}"
          rm -f "${validation_log}"
          exit "${exit_code}"

      - name: Write Backend Daily legacy mirrors
        if: steps.delivery.outputs.should_generate == 'true' && matrix.locale == 'ko-KR'
        shell: bash
        env:
          REPORT_FILE: ${{ steps.prepare.outputs.report_file }}
          CODEX_SUMMARY_FILE: ${{ steps.locale.outputs.codex_summary_file }}
          VALIDATION_REPORT: ${{ steps.locale.outputs.validation_report }}
          LEGACY_REPORT_FILE: ${{ steps.locale.outputs.legacy_report_file }}
          LEGACY_CODEX_SUMMARY_FILE: ${{ steps.locale.outputs.legacy_codex_summary_file }}
          LEGACY_VALIDATION_REPORT: ${{ steps.locale.outputs.legacy_validation_report }}
        run: |
          set -euo pipefail
          if [ -n "${LEGACY_REPORT_FILE}" ] && [ -f "${REPORT_FILE}" ]; then
            mkdir -p "$(dirname "${LEGACY_REPORT_FILE}")"
            cp "${REPORT_FILE}" "${LEGACY_REPORT_FILE}"
          fi
          if [ -n "${LEGACY_CODEX_SUMMARY_FILE}" ] && [ -f "${CODEX_SUMMARY_FILE}" ]; then
            mkdir -p "$(dirname "${LEGACY_CODEX_SUMMARY_FILE}")"
            cp "${CODEX_SUMMARY_FILE}" "${LEGACY_CODEX_SUMMARY_FILE}"
          fi
          if [ -n "${LEGACY_VALIDATION_REPORT}" ] && [ -f "${VALIDATION_REPORT}" ]; then
            mkdir -p "$(dirname "${LEGACY_VALIDATION_REPORT}")"
            cp "${VALIDATION_REPORT}" "${LEGACY_VALIDATION_REPORT}"
          fi

      - name: Wait until configured Backend Daily send time
        id: wait-before-send
        if: github.event_name == 'schedule' && steps.delivery.outputs.should_send == 'true'
        shell: bash
        env:
          RUNTIME_TIMEZONE: ${{ steps.runtime_gate.outputs.timezone }}
          RUNTIME_LOCAL_DATE: ${{ steps.runtime_gate.outputs.local_date }}
          TARGET_TIME: ${{ steps.runtime_gate.outputs.target_time }}
        run: |
          set -euo pipefail

          now_epoch="$(TZ="${RUNTIME_TIMEZONE}" date +%s)"
          target_epoch="$(TZ="${RUNTIME_TIMEZONE}" date -d "${RUNTIME_LOCAL_DATE} ${TARGET_TIME}:00" +%s)"

          if [ "${now_epoch}" -lt "${target_epoch}" ]; then
            wait_seconds=$((target_epoch - now_epoch))
            echo "Waiting ${wait_seconds}s until ${TARGET_TIME} ${RUNTIME_TIMEZONE} before Discord send."
            sleep "${wait_seconds}"
          else
            echo "Already past ${TARGET_TIME} ${RUNTIME_TIMEZONE}. Sending immediately."
          fi

      - name: Send backend daily brief to Discord
        id: send-discord
        if: steps.delivery.outputs.should_send == 'true'
        shell: bash
        env:
          REPORT_FILE: ${{ steps.prepare.outputs.report_file }}
          LOCALE: ${{ matrix.locale }}
          DISCORD_WEBHOOK_KO_KR_BACKEND_DAILY: ${{ secrets.DISCORD_WEBHOOK_KO_KR_BACKEND_DAILY }}
          DISCORD_WEBHOOK_EN_US_BACKEND_DAILY: ${{ secrets.DISCORD_WEBHOOK_EN_US_BACKEND_DAILY }}
          DISCORD_WEBHOOK_KR_TECH_DAILY: ${{ secrets.DISCORD_WEBHOOK_KR_TECH_DAILY }}
          DISCORD_WEBHOOK_CAREER_FEED: ${{ secrets.DISCORD_WEBHOOK_CAREER_FEED }}
        run: |
          set -euo pipefail
          if [ "${LOCALE}" = "ko-KR" ]; then
            export DISCORD_WEBHOOK_URL="${DISCORD_WEBHOOK_KO_KR_BACKEND_DAILY:-${DISCORD_WEBHOOK_KR_TECH_DAILY:-${DISCORD_WEBHOOK_CAREER_FEED:-}}}"
          elif [ "${LOCALE}" = "en-US" ]; then
            export DISCORD_WEBHOOK_URL="${DISCORD_WEBHOOK_EN_US_BACKEND_DAILY:-${DISCORD_WEBHOOK_CAREER_FEED:-}}"
          fi
          python3 scripts/send-discord.py "${REPORT_FILE}"

      - name: Create Backend Daily delivery lock marker
        id: create-lock
        if: steps.send-discord.outcome == 'success' && steps.context.outputs.dry_run != 'true'
        shell: bash
        env:
          RUNTIME_TIMEZONE: ${{ steps.runtime_gate.outputs.timezone }}
        run: |
          set -euo pipefail
          printf 'sent_at_local=%s\nsent_at_kst=%s\nrun_id=%s\n' \
            "$(TZ="${RUNTIME_TIMEZONE}" date '+%Y-%m-%d %H:%M:%S %Z')" \
            "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')" \
            "${GITHUB_RUN_ID}" > "${{ steps.context.outputs.lock_marker }}"

      - name: Save Backend Daily delivery lock
        id: save-lock
        if: steps.create-lock.outcome == 'success' && steps.delivery-lock.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.context.outputs.lock_marker }}
          key: ${{ steps.context.outputs.delivery_lock_key }}

      - name: Commit Programmers assignment progress
        id: commit-ps-progress
        if: steps.send-discord.outcome == 'success' && steps.context.outputs.dry_run != 'true' && matrix.locale == 'ko-KR'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/ps-progress.json data/spring-jvm-blog-topic-progress.json; then
            echo "No daily progress changes to commit."
            echo "ps_progress_changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "ps_progress_changed=true" >> "${GITHUB_OUTPUT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ps-progress.json data/spring-jvm-blog-topic-progress.json
          git commit -m "chore(progress): record backend daily progress"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              echo "PS progress committed and pushed."
              exit 0
            fi

            echo "PS progress push failed on attempt ${attempt}; retrying." >&2
            sleep $((attempt * 2))
          done

          echo "Failed to push PS progress after retries." >&2
          exit 1

      - name: Write Backend Daily run summary
        id: run-summary
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ steps.context.outputs.dry_run }}
          FORCE_SEND: ${{ steps.context.outputs.force_send }}
          DELIVERY_LOCK_KEY: ${{ steps.context.outputs.delivery_lock_key }}
          DELIVERY_LOCK_HIT: ${{ steps.delivery-lock.outputs.cache-hit == 'true' }}
          SHOULD_GENERATE: ${{ steps.delivery.outputs.should_generate }}
          SHOULD_SEND: ${{ steps.delivery.outputs.should_send }}
          SKIP_REASON: ${{ steps.delivery.outputs.skip_reason }}
          DISCORD_SEND_OUTCOME: ${{ steps.send-discord.outcome }}
          PS_PROGRESS_COMMIT_OUTCOME: ${{ steps.commit-ps-progress.outcome }}
          PS_PROGRESS_CHANGED: ${{ steps.commit-ps-progress.outputs.ps_progress_changed }}
          LOCALE: ${{ matrix.locale }}
          OPS_DIR: ${{ steps.locale.outputs.ops_dir }}
          CANDIDATE_DIR: ${{ steps.locale.outputs.candidate_dir }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ops_dir = Path(os.environ["OPS_DIR"])
          ops_dir.mkdir(parents=True, exist_ok=True)
          candidate_dir = Path(os.environ["CANDIDATE_DIR"])
          candidate_paths = [
              candidate_dir / "spring-study-topic.json",
              candidate_dir / "ps-weekly-routine.json",
              candidate_dir / "kr-oss-contribution-opportunities.json",
              candidate_dir / "backend-practical-knowledge.json",
              candidate_dir / "cs-core-daily-topic.json",
              candidate_dir / "backend-term-daily.json",
          ]
          candidate_count = 0
          source_errors = set()
          oss_payload = {}
          oss_path = candidate_dir / "kr-oss-contribution-opportunities.json"
          for path in candidate_paths:
              if not path.exists():
                  continue
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  continue
              items = data.get("items", [])
              candidate_count += int(data.get("candidate_count", len(items) if isinstance(items, list) else 0) or 0)
              for error in data.get("source_errors", []) if isinstance(data.get("source_errors", []), list) else []:
                  source_errors.add(json.dumps(error, ensure_ascii=False, sort_keys=True))
              if path == oss_path:
                  oss_payload = data

          def int_value(value):
              try:
                  return int(value or 0)
              except (TypeError, ValueError):
                  return 0

          def sum_count_values(mapping):
              if not isinstance(mapping, dict):
                  return 0
              return sum(int_value(value) for value in mapping.values())

          oss_items = oss_payload.get("items", []) if isinstance(oss_payload, dict) else []
          if not isinstance(oss_items, list):
              oss_items = []
          oss_safe_items = [
              item
              for item in oss_items
              if isinstance(item, dict) and item.get("safe_to_recommend") is True
          ]
          oss_diagnostics = oss_payload.get("diagnostics", {}) if isinstance(oss_payload, dict) else {}
          if not isinstance(oss_diagnostics, dict):
              oss_diagnostics = {}
          oss_gate_exclusions = oss_diagnostics.get("gate_exclusion_counts", {})
          oss_source_error_types = oss_diagnostics.get("source_error_type_counts", {})
          oss_filtered_out_count = sum_count_values(oss_gate_exclusions)
          oss_safe_candidate_count = int_value(
              oss_diagnostics.get("safe_items_count", len(oss_safe_items))
          )
          oss_candidate_count = oss_safe_candidate_count + oss_filtered_out_count
          oss_source_errors = (
              oss_payload.get("source_errors", [])
              if isinstance(oss_payload.get("source_errors", []), list)
              else []
          ) if isinstance(oss_payload, dict) else []
          oss_source_errors_count = max(
              len(oss_source_errors),
              sum_count_values(oss_source_error_types),
          )
          selected_oss = oss_safe_items[0] if oss_safe_items else {}
          selected_oss_repository = str(
              selected_oss.get("repository") or selected_oss.get("repo") or ""
          ).strip() if selected_oss else ""
          selected_oss_issue_url = str(selected_oss.get("url") or "").strip() if selected_oss else ""
          selected_oss_issue_number = str(selected_oss.get("issue_number") or "").strip() if selected_oss else ""
          selected_oss_difficulty_band = str(
              selected_oss.get("difficulty_band") or ""
          ).strip() if selected_oss else ""
          oss_fallback_reason = None
          if oss_safe_candidate_count == 0:
              oss_fallback_reason = str(
                  oss_diagnostics.get("fallback_when_empty")
                  or "oss-preparation-routine"
              )
          oss_linked_work_check_degraded = bool(
              int_value(oss_gate_exclusions.get("linked-work-check-unknown"))
              or int_value(oss_source_error_types.get("github_graphql_token_missing"))
              or int_value(oss_source_error_types.get("github_graphql_request_failed"))
              or int_value(oss_source_error_types.get("github_graphql_response_error"))
              or int_value(oss_source_error_types.get("github_rate_limit"))
          )
          oss_selected_label = "없음"
          if selected_oss_repository and selected_oss_issue_number:
              oss_selected_label = f"{selected_oss_repository} #{selected_oss_issue_number}"
          elif selected_oss_repository and selected_oss_issue_url:
              oss_selected_label = f"{selected_oss_repository} ({selected_oss_issue_url})"
          oss_warning = (
              "linked work check degraded 있음"
              if oss_linked_work_check_degraded
              else "linked work check degraded 없음"
          )
          oss_selected_band_label = (
              f" ({selected_oss_difficulty_band})"
              if selected_oss_difficulty_band
              else ""
          )

          send_attempted = os.environ.get("SHOULD_SEND") == "true"
          send_success = os.environ.get("DISCORD_SEND_OUTCOME") == "success"
          ps_commit_outcome = os.environ.get("PS_PROGRESS_COMMIT_OUTCOME", "")
          summary = {
              "feed": "backend-daily",
              "locale": os.environ.get("LOCALE", ""),
              "generated_at_kst": os.popen("TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST'").read().strip(),
              "event_name": os.environ.get("EVENT_NAME", ""),
              "schedule": os.environ.get("EVENT_SCHEDULE", ""),
              "dry_run": os.environ.get("DRY_RUN") == "true",
              "force_send": os.environ.get("FORCE_SEND") == "true",
              "delivery_lock_key": os.environ.get("DELIVERY_LOCK_KEY", ""),
              "delivery_lock_hit": os.environ.get("DELIVERY_LOCK_HIT") == "true",
              "candidate_count_total": candidate_count,
              "selected_news_count": None,
              "fallback_reason": os.environ.get("SKIP_REASON") or None,
              "source_errors_count": len(source_errors),
              "oss_safe_candidate_count": oss_safe_candidate_count,
              "oss_candidate_count": oss_candidate_count,
              "oss_filtered_out_count": oss_filtered_out_count,
              "oss_fallback_reason": oss_fallback_reason,
              "oss_source_errors_count": oss_source_errors_count,
              "selected_oss_repository": selected_oss_repository or None,
              "selected_oss_issue_url": selected_oss_issue_url or None,
              "selected_oss_difficulty_band": selected_oss_difficulty_band or None,
              "oss_linked_work_check_degraded": oss_linked_work_check_degraded,
              "discord_send_attempted": send_attempted,
              "discord_send_success": send_success,
              "generation_attempted": os.environ.get("SHOULD_GENERATE") == "true",
              "ps_progress_commit_attempted": ps_commit_outcome not in ("", "skipped"),
              "ps_progress_changed": os.environ.get("PS_PROGRESS_CHANGED") == "true",
              "ps_progress_commit_success": ps_commit_outcome in ("success", "skipped"),
          }
          json_path = ops_dir / "backend-daily-run-summary.json"
          md_path = ops_dir / "backend-daily-run-summary.md"
          json_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          md_path.write_text(
              "# Backend Daily Run Summary\n\n"
              f"- event: {summary['event_name']}\n"
              f"- schedule: {summary['schedule']}\n"
              f"- dry_run: {summary['dry_run']}\n"
              f"- force_send: {summary['force_send']}\n"
              f"- delivery_lock_key: {summary['delivery_lock_key']}\n"
              f"- delivery_lock_hit: {summary['delivery_lock_hit']}\n"
              f"- discord_send_attempted: {summary['discord_send_attempted']}\n"
              f"- discord_send_success: {summary['discord_send_success']}\n"
              f"- candidate_count_total: {summary['candidate_count_total']}\n"
              "\n## OSS Candidate Ops\n\n"
              f"- OSS 후보 상태: safe {summary['oss_safe_candidate_count']}개 / "
              f"filtered {summary['oss_filtered_out_count']}개 / "
              f"fallback {summary['oss_fallback_reason'] or '없음'}\n"
              f"- 선택 후보: {oss_selected_label}{oss_selected_band_label}\n"
              f"- 주의: {oss_warning}, source_errors {summary['oss_source_errors_count']}개\n"
              "\n## PS Progress Ops\n\n"
              f"- ps_progress_commit_attempted: {summary['ps_progress_commit_attempted']}\n"
              f"- ps_progress_changed: {summary['ps_progress_changed']}\n"
              f"- ps_progress_commit_success: {summary['ps_progress_commit_success']}\n"
              f"- fallback_reason: {summary['fallback_reason']}\n",
              encoding="utf-8",
          )
          PY

      - name: Notify ops webhook on failure
        if: failure()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CAREER_FEED_OPS }}
          LOCALE: ${{ matrix.locale }}
          OPS_DIR: ${{ steps.locale.outputs.ops_dir }}
        run: |
          set +e
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "Ops webhook not configured; skipping failure alert."
            exit 0
          fi

          failed_step="unknown"
          for pair in \
            "check-secrets:${{ steps.check-secrets.outcome }}" \
            "collect:${{ steps.collect.outcome }}" \
            "generate-primary:${{ steps.generate-primary.outcome }}" \
            "generate-retry:${{ steps.generate-retry.outcome }}" \
            "generation-status:${{ steps.generation-status.outcome }}" \
            "validate:${{ steps.validate.outcome }}" \
            "send-discord:${{ steps.send-discord.outcome }}" \
            "save-lock:${{ steps.save-lock.outcome }}" \
            "commit-ps-progress:${{ steps.commit-ps-progress.outcome }}" \
          do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "${outcome}" = "failure" ]; then
              failed_step="${name}"
              break
            fi
          done

          mkdir -p "${OPS_DIR}"
          alert_file="${OPS_DIR}/backend-daily-failure-alert.md"
          validation_error=""
          if [ -f "${OPS_DIR}/backend-daily-validation-report.md" ]; then
            validation_error="$(grep -m 1 '^- error:' "${OPS_DIR}/backend-daily-validation-report.md" | sed 's/^- error: //' || true)"
          fi
          {
            echo "Career Feed workflow failed"
            echo
            echo "- workflow: ${GITHUB_WORKFLOW}"
            echo "- locale: ${LOCALE}"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- branch: ${GITHUB_REF_NAME}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- failed step: ${failed_step}"
            if [ -n "${validation_error}" ]; then
              echo "- validator error: ${validation_error}"
            fi
            echo "- artifact: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${alert_file}"
          python3 scripts/send-discord.py "${alert_file}" || true

      - name: Upload backend daily artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: career-feed-backend-daily-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            reports/candidates/${{ matrix.locale }}/
            reports/briefs/${{ matrix.locale }}/
            reports/ops/${{ matrix.locale }}/
            reports/briefs/kr-tech-daily.md
            reports/briefs/kr-tech-daily-codex-summary.md
            reports/ops/backend-daily-validation-report.md
          if-no-files-found: warn
          retention-days: 14
