name: Backend Daily

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the report without sending it to Discord"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: career-feed-backend-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Backend Daily
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Collect official Spring updates
        continue-on-error: true
        run: |
          rm -f reports/spring-updates.json
          python3 scripts/collect_spring_updates.py \
            --live-dry-run \
            --output reports/spring-updates.json

      - name: Generate deterministic brief
        run: >-
          python3 scripts/generate_backend_daily.py
          --spring-updates reports/spring-updates.json

      - name: Show brief in run summary
        run: cat reports/backend-daily.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Send brief to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_KR_TECH_DAILY }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN:-true}" = "true" ]; then
            echo "Dry-run: Discord delivery skipped."
            exit 0
          fi

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; artifact generation still succeeded."
            exit 0
          fi

          python3 scripts/send_discord.py reports/backend-daily.md

      - name: Upload brief
        if: ${{ !cancelled() && hashFiles('reports/backend-daily.md') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-daily
          path: reports/backend-daily.md
          if-no-files-found: error
          retention-days: 7
