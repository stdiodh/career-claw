name: Daily Korea Dev AI News

on:
  schedule:
    - cron: "15 8 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "30 9 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate artifacts without sending Discord"
        required: false
        type: boolean
        default: false
      force_send:
        description: "Send even if today's delivery lock exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: career-feed-news-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate and send Korea dev AI news daily
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare report directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/candidates reports/briefs reports/ops/delivery-locks

      - name: Set run context
        id: context
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          INPUT_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || false }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          kst_now="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          kst_date="$(TZ=Asia/Seoul date '+%Y-%m-%d')"
          delivery_lock_key="career-feed-news-sent-${kst_date}"
          lock_marker="reports/ops/delivery-locks/news-sent-${kst_date}.lock"

          echo "event_name=${EVENT_NAME}"
          echo "event_schedule=${EVENT_SCHEDULE:-}"
          echo "kst_now=${kst_now}"
          echo "dry_run=${INPUT_DRY_RUN}"
          echo "force_send=${INPUT_FORCE_SEND}"

          {
            echo "kst_now=${kst_now}"
            echo "kst_date=${kst_date}"
            echo "dry_run=${INPUT_DRY_RUN}"
            echo "force_send=${INPUT_FORCE_SEND}"
            echo "delivery_lock_key=${delivery_lock_key}"
            echo "lock_marker=${lock_marker}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore News Daily delivery lock
        id: delivery-lock
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.context.outputs.lock_marker }}
          key: ${{ steps.context.outputs.delivery_lock_key }}

      - name: Decide delivery action
        id: delivery
        shell: bash
        env:
          DRY_RUN: ${{ steps.context.outputs.dry_run }}
          FORCE_SEND: ${{ steps.context.outputs.force_send }}
          LOCK_HIT: ${{ steps.delivery-lock.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail

          should_generate="true"
          should_send="true"
          skip_reason=""

          if [ "${DRY_RUN}" = "true" ]; then
            should_send="false"
            skip_reason="dry_run"
          elif [ "${LOCK_HIT}" = "true" ] && [ "${FORCE_SEND}" != "true" ]; then
            should_generate="false"
            should_send="false"
            skip_reason="delivery_lock_hit"
          fi

          echo "should_generate=${should_generate}" >> "${GITHUB_OUTPUT}"
          echo "should_send=${should_send}" >> "${GITHUB_OUTPUT}"
          echo "skip_reason=${skip_reason}" >> "${GITHUB_OUTPUT}"

          if [ "${should_send}" != "true" ]; then
            {
              echo "# News Daily Discord send skipped"
              echo
              echo "- reason: ${skip_reason}"
              echo "- delivery_lock_hit: ${LOCK_HIT}"
              echo "- force_send: ${FORCE_SEND}"
              echo "- dry_run: ${DRY_RUN}"
            } > reports/ops/news-daily-discord-skip.md
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check required secrets
        id: check-secrets
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_KR_TECH_NEWS_DAILY: ${{ secrets.DISCORD_WEBHOOK_KR_TECH_NEWS_DAILY }}
          SHOULD_GENERATE: ${{ steps.delivery.outputs.should_generate }}
          SHOULD_SEND: ${{ steps.delivery.outputs.should_send }}
        run: |
          set -euo pipefail

          missing=()
          if [ "${SHOULD_GENERATE}" = "true" ] && [ -z "${OPENAI_API_KEY}" ]; then
            missing+=("OPENAI_API_KEY")
          fi
          if [ "${SHOULD_SEND}" = "true" ] && [ -z "${DISCORD_WEBHOOK_KR_TECH_NEWS_DAILY}" ]; then
            missing+=("DISCORD_WEBHOOK_KR_TECH_NEWS_DAILY")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Collect Korea dev AI news candidates
        id: collect
        if: steps.delivery.outputs.should_generate == 'true'
        shell: bash
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python3 scripts/collect-kr-feeds.py --mode daily-news

      - name: Build News Daily shortlist
        id: shortlist
        if: steps.delivery.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-daily-news-shortlist.py

      - name: Estimate News Daily prompt budget
        id: prompt-budget
        if: steps.delivery.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/estimate-prompt-budget.py \
            --kst-now "${{ steps.context.outputs.kst_now }}"

      - name: Prepare KST runtime prompt
        id: prepare
        if: steps.delivery.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail

          kst_now="${{ steps.context.outputs.kst_now }}"
          runtime_prompt="${RUNNER_TEMP}/kr-tech-news-daily-${GITHUB_RUN_ID}.md"
          shortlist_file="reports/candidates/kr-tech-news-shortlist.json"
          report_file="reports/briefs/kr-tech-news-daily.md"

          KST_NOW="${kst_now}" \
          RUNTIME_PROMPT="${runtime_prompt}" \
          SHORTLIST_FILE="${shortlist_file}" \
          REPORT_FILE="${report_file}" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(".github/codex/prompts/kr-tech-news-daily.md")
          destination = Path(os.environ["RUNTIME_PROMPT"])
          prompt = source.read_text(encoding="utf-8").rstrip()
          runtime = prompt + "\n\n## Runtime Context\n\n"
          runtime += f"- KST_NOW: {os.environ['KST_NOW']}\n"
          runtime += f"- SHORTLIST_FILE: {os.environ['SHORTLIST_FILE']}\n"
          runtime += f"- OUTPUT_FILE: {os.environ['REPORT_FILE']}\n"
          runtime += "- FALLBACK_CANDIDATE_FILES:\n"
          runtime += "- reports/candidates/kr-dev-ai-news.json\n"
          runtime += "- reports/candidates/kr-ai-tech-news.json\n"
          destination.write_text(runtime, encoding="utf-8")
          PY

          {
            echo "runtime_prompt=${runtime_prompt}"
            echo "report_file=${report_file}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate Korea dev AI news Markdown
        id: generate-primary
        if: steps.delivery.outputs.should_generate == 'true'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prepare.outputs.runtime_prompt }}
          output-file: reports/briefs/kr-tech-news-daily-codex-summary.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--model","gpt-5.4-mini","-c","model_reasoning_effort=\"low\""]'

      - name: Retry Korea dev AI news Markdown generation
        id: generate-retry
        if: steps.delivery.outputs.should_generate == 'true' && steps.generate-primary.outcome == 'failure'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prepare.outputs.runtime_prompt }}
          output-file: reports/briefs/kr-tech-news-daily-codex-summary.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--model","gpt-5.4-mini","-c","model_reasoning_effort=\"low\""]'

      - name: Fail if Korea dev AI news generation failed
        id: generation-status
        if: steps.delivery.outputs.should_generate == 'true' && steps.generate-primary.outcome != 'success' && steps.generate-retry.outcome != 'success'
        shell: bash
        run: |
          echo "Korea dev AI news generation failed after retry." >&2
          exit 1

      - name: Validate Korea dev AI news Markdown
        id: validate
        if: steps.delivery.outputs.should_generate == 'true'
        shell: bash
        env:
          REPORT_FILE: ${{ steps.prepare.outputs.report_file }}
        run: |
          set -euo pipefail
          python3 scripts/validate-career-feed-brief.py "${REPORT_FILE}" --type daily-news

      - name: Wait until 09:05 KST before Discord send
        id: wait-before-send
        if: github.event_name == 'schedule' && steps.delivery.outputs.should_send == 'true'
        shell: bash
        run: |
          set -euo pipefail

          now_epoch="$(TZ=Asia/Seoul date +%s)"
          today_kst="$(TZ=Asia/Seoul date '+%Y-%m-%d')"
          target_epoch="$(TZ=Asia/Seoul date -d "${today_kst} 09:05:00" +%s)"

          if [ "${now_epoch}" -lt "${target_epoch}" ]; then
            wait_seconds=$((target_epoch - now_epoch))
            echo "Waiting ${wait_seconds}s until 09:05 KST before Discord send."
            sleep "${wait_seconds}"
          else
            echo "Already past 09:05 KST. Sending immediately."
          fi

      - name: Send Korea dev AI news to Discord
        id: send-discord
        if: steps.delivery.outputs.should_send == 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_KR_TECH_NEWS_DAILY }}
          REPORT_FILE: ${{ steps.prepare.outputs.report_file }}
        run: |
          set -euo pipefail
          python3 scripts/send-discord.py "${REPORT_FILE}"

      - name: Create News Daily delivery lock marker
        id: create-lock
        if: steps.send-discord.outcome == 'success' && steps.context.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf 'sent_at_kst=%s\nrun_id=%s\n' \
            "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')" \
            "${GITHUB_RUN_ID}" > "${{ steps.context.outputs.lock_marker }}"

      - name: Save News Daily delivery lock
        id: save-lock
        if: steps.create-lock.outcome == 'success' && steps.delivery-lock.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.context.outputs.lock_marker }}
          key: ${{ steps.context.outputs.delivery_lock_key }}

      - name: Write News Daily run summary
        id: run-summary
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ steps.context.outputs.dry_run }}
          FORCE_SEND: ${{ steps.context.outputs.force_send }}
          DELIVERY_LOCK_KEY: ${{ steps.context.outputs.delivery_lock_key }}
          DELIVERY_LOCK_HIT: ${{ steps.delivery-lock.outputs.cache-hit == 'true' }}
          SHOULD_GENERATE: ${{ steps.delivery.outputs.should_generate }}
          SHOULD_SEND: ${{ steps.delivery.outputs.should_send }}
          SKIP_REASON: ${{ steps.delivery.outputs.skip_reason }}
          DISCORD_SEND_OUTCOME: ${{ steps.send-discord.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/write-news-daily-run-summary.py \
            --output-json reports/ops/news-daily-run-summary.json \
            --output-md reports/ops/news-daily-run-summary.md

      - name: Notify ops webhook on failure
        if: failure()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CAREER_FEED_OPS }}
        run: |
          set +e
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "Ops webhook not configured; skipping failure alert."
            exit 0
          fi

          failed_step="unknown"
          for pair in \
            "check-secrets:${{ steps.check-secrets.outcome }}" \
            "collect:${{ steps.collect.outcome }}" \
            "shortlist:${{ steps.shortlist.outcome }}" \
            "prompt-budget:${{ steps.prompt-budget.outcome }}" \
            "prepare:${{ steps.prepare.outcome }}" \
            "generate-primary:${{ steps.generate-primary.outcome }}" \
            "generate-retry:${{ steps.generate-retry.outcome }}" \
            "generation-status:${{ steps.generation-status.outcome }}" \
            "validate:${{ steps.validate.outcome }}" \
            "send-discord:${{ steps.send-discord.outcome }}" \
            "save-lock:${{ steps.save-lock.outcome }}"
          do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "${outcome}" = "failure" ]; then
              failed_step="${name}"
              break
            fi
          done

          alert_file="reports/ops/news-daily-failure-alert.md"
          {
            echo "Career Feed workflow failed"
            echo
            echo "- workflow: ${GITHUB_WORKFLOW}"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- branch: ${GITHUB_REF_NAME}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- failed step: ${failed_step}"
            echo "- artifact: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${alert_file}"
          python3 scripts/send-discord.py "${alert_file}" || true

      - name: Upload Korea dev AI news artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: career-feed-kr-tech-news-daily-${{ github.run_id }}
          path: |
            reports/candidates/kr-dev-ai-news.json
            reports/candidates/kr-ai-tech-news.json
            reports/candidates/kr-tech-news-shortlist.json
            reports/briefs/kr-tech-news-daily.md
            reports/briefs/kr-tech-news-daily-codex-summary.md
            reports/ops/*.json
            reports/ops/*.md
          if-no-files-found: warn
          retention-days: 14
