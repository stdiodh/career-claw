name: OSS Recommendations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Collect read-only OSS recommendations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Collect candidates
        run: |
          python3 scripts/collect_oss_candidates.py \
            --live-dry-run \
            --json-output reports/oss-candidates.json \
            --markdown-output reports/oss-candidates.md

      - name: Publish summary
        run: cat reports/oss-candidates.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload recommendation artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: oss-recommendations-${{ github.run_id }}
          path: |
            reports/oss-candidates.json
            reports/oss-candidates.md
          if-no-files-found: error
          retention-days: 14
