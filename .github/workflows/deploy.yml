name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: app

      - name: Run Gradle build
        run: ./gradlew build --no-daemon
        working-directory: app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /opt/career-claw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote deploy path exists
        run: |
          ssh "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" "mkdir -p ${DEPLOY_PATH}/infra"

      - name: Create deployment env file
        run: |
          cat > .deploy.env <<EOF
          SPRING_PROFILES_ACTIVE=prod
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPONAME=${{ secrets.DOCKER_REPONAME }}
          APP_IMAGE_TAG=${{ github.sha }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          OPENCLAW_AUTH_TOKEN=${{ secrets.OPENCLAW_AUTH_TOKEN }}
          OPENCLAW_GATEWAY_PORT=18789
          DOMAIN=${{ secrets.DOMAIN }}
          APP_PORT=8080
          EOF

      - name: Sync infra to EC2
        run: |
          rsync -az --delete \
            infra/ "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${DEPLOY_PATH}/infra/"

      - name: Upload runtime env file
        run: |
          rsync -az .deploy.env "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${DEPLOY_PATH}/.env"

      - name: Run docker compose on EC2
        run: |
          ssh "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            "mkdir -p ${DEPLOY_PATH}/infra/openclaw/workspace && \
             cd ${DEPLOY_PATH}/infra && \
             docker compose --env-file ../.env -f compose.yaml pull && \
             docker compose --env-file ../.env -f compose.yaml up -d --remove-orphans && \
             docker compose --env-file ../.env -f compose.yaml ps"

      - name: Remove local deployment env file
        if: always()
        run: rm -f .deploy.env
