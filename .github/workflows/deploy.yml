name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /opt/career-claw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Create deployment env file
        run: |
          cat > .deploy.env <<EOF
          SPRING_PROFILES_ACTIVE=prod
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          OPENCLAW_AUTH_TOKEN=${{ secrets.OPENCLAW_AUTH_TOKEN }}
          OPENCLAW_GATEWAY_PORT=18789
          DOMAIN=${{ secrets.DOMAIN }}
          APP_PORT=8080
          EOF

      - name: Sync repository to EC2
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".idea/" \
            --exclude ".gradle/" \
            --exclude "app/.gradle/" \
            --exclude "app/build/" \
            ./ "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${DEPLOY_PATH}/"

      - name: Upload runtime env file
        run: |
          rsync -az .deploy.env "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${DEPLOY_PATH}/.env"

      - name: Run remote deploy
        run: |
          ssh "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            "bash ${DEPLOY_PATH}/infra/scripts/deploy.sh ${DEPLOY_PATH}"

      - name: Remove local deployment env file
        if: always()
        run: rm -f .deploy.env
