name: Release Deploy (Docker Hub + EC2)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "DOCS/**"
      - "SECRET_DOCS/**"
      - "*.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle check
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew check --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:${{ github.sha }}

      - name: Create deploy directory on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            mkdir -p /home/${{ secrets.AWS_USER }}/app/career-claw/infra/openclaw/workspace

      - name: Copy infra files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "infra"
          target: /home/${{ secrets.AWS_USER }}/app/career-claw

      - name: Create .env on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cat > /home/${{ secrets.AWS_USER }}/app/career-claw/.env <<'__ENV__'
            SPRING_PROFILES_ACTIVE=prod
            APP_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}
            IMAGE_TAG=${{ github.sha }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            OPENCLAW_AUTH_TOKEN=${{ secrets.OPENCLAW_AUTH_TOKEN }}
            OPENCLAW_GATEWAY_PORT=18789
            DOMAIN=${{ secrets.DOMAIN }}
            APP_PORT=8082
            __ENV__

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/${{ secrets.AWS_USER }}/app/career-claw/infra
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            if sudo docker compose version >/dev/null 2>&1; then
              sudo docker compose --env-file ../.env -f compose.yaml pull app openclaw
              sudo docker compose --env-file ../.env -f compose.yaml up -d --force-recreate app openclaw
              sudo docker compose --env-file ../.env -f compose.yaml ps
            elif command -v docker-compose >/dev/null 2>&1; then
              sudo docker-compose --env-file ../.env -f compose.yaml pull app openclaw
              sudo docker-compose --env-file ../.env -f compose.yaml up -d --force-recreate app openclaw
              sudo docker-compose --env-file ../.env -f compose.yaml ps
            else
              echo "Docker Compose is not installed on EC2."
              exit 1
            fi

            sudo docker image prune -f
