name: Backend Career Site Radar

on:
  workflow_dispatch:
    inputs:
      send_to_discord:
        description: "Send rendered site radar to Discord"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: career-feed-backend-career-site-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-career-site-radar:
    name: Render backend career site radar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Prepare report directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/candidates reports/briefs

      - name: Render backend career site radar
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render-weekly-career-site-radar.py

      - name: Validate backend career site radar
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-career-feed-brief.py reports/briefs/kr-backend-career-weekly.md --type weekly-career

      - name: Send backend career site radar to Discord
        if: ${{ inputs.send_to_discord == 'true' }}
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_BACKEND_CAREER_WEEKLY }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "Missing required secret: DISCORD_WEBHOOK_BACKEND_CAREER_WEEKLY" >&2
            exit 1
          fi
          python3 scripts/send-discord.py reports/briefs/kr-backend-career-weekly.md

      - name: Upload backend career site radar artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: career-feed-backend-career-site-radar-${{ github.run_id }}
          path: |
            reports/candidates/weekly-career-site-radar.json
            reports/briefs/kr-backend-career-weekly.md
          if-no-files-found: warn
