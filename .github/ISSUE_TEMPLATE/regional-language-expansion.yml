name: 지역 또는 언어 확장 제안
description: 새 지역, 언어, locale 기반 출처 확장을 제안합니다.
title: "[지역/언어] "
labels:
  - enhancement
  - source
body:
  - type: markdown
    attributes:
      value: |
        지역 또는 언어 확장은 검토용 제안으로 받습니다.

        이 이슈를 연다고 해서 새 workflow나 새 지역 지원이 바로 추가되지는 않습니다.
  - type: input
    id: region-locale
    attributes:
      label: region, locale, language
      description: 제안하는 지역, locale, 언어를 적어 주세요.
      placeholder: 예) region=jp, locale=ja-JP, language=Japanese
    validations:
      required: true
  - type: input
    id: timezone
    attributes:
      label: timezone
      placeholder: 예) Asia/Tokyo
    validations:
      required: true
  - type: textarea
    id: public-sources
    attributes:
      label: 공개 출처 후보
      description: 채용, 기술 블로그, 뉴스, 커뮤니티 등 공개적으로 확인 가능한 출처를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 왜 필요한가요?
      description: 이 확장이 어떤 학습자나 maintainer 문제를 줄이는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 검토할 위험
      description: source reliability, scraping 제한, 언어 검토 가능성, privacy, maintainer workload를 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 범위 확인
      options:
        - label: 이 제안은 즉시 workflow 추가를 요구하지 않습니다.
          required: true
        - label: 공개적으로 확인 가능한 출처만 포함했습니다.
          required: true
        - label: secret이나 private identifier를 포함하지 않았습니다.
          required: true
