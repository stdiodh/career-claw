name: 버그 리포트
description: workflow, validator, artifact, Discord delivery 문제를 보고합니다.
title: "[버그] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        버그를 보고해 주셔서 감사합니다.

        API key, token, Discord webhook URL, private Discord 정보, 개인 식별자는 절대 붙여 넣지 마세요.
        로그와 screenshot은 먼저 redaction한 뒤 필요한 부분만 공유해 주세요.
  - type: dropdown
    id: workflow
    attributes:
      label: 관련 workflow
      options:
        - Backend Daily Brief
        - Dev News Daily
        - Backend Career Site Radar
        - Mark PS Solved
        - Local validation
        - Other
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: 관련 locale
      options:
        - ko-KR
        - en-US
        - locale-independent
        - unknown
    validations:
      required: true
  - type: dropdown
    id: trigger
    attributes:
      label: 실행 방식
      options:
        - workflow_dispatch
        - schedule
        - local command
        - unknown
    validations:
      required: true
  - type: input
    id: dry-run
    attributes:
      label: dry-run 또는 delivery 입력값
      placeholder: 예) dry_run=true, force_send=false
    validations:
      required: false
  - type: input
    id: artifact-path
    attributes:
      label: 관련 artifact path
      description: 가능하면 실패한 report, candidate, ops artifact 경로를 적어 주세요.
      placeholder: 예) reports/ops/ko-KR/news-daily-validation-report.md
    validations:
      required: false
  - type: textarea
    id: validation-output
    attributes:
      label: 검증 명령과 출력
      description: 실행한 명령과 실패한 마지막 부분을 붙여 주세요. secret은 제거해 주세요.
      placeholder: |
        command: ./scripts/validate.sh
        output: ...
    validations:
      required: false
  - type: textarea
    id: observed
    attributes:
      label: 실제 동작
      description: 어떤 단계에서 실패했는지 적어 주세요. secret 값은 제거해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 어떤 결과를 기대했는지 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 확인한 항목
      options:
        - label: workflow run log를 확인했습니다.
          required: false
        - label: validation report artifact를 확인했습니다.
          required: false
        - label: generated artifact를 확인했습니다.
          required: false
        - label: secret, webhook URL, GitHub token, OpenAI API key, private identifier를 제거했습니다.
          required: true
