name: Fork trial report
description: Report a redacted first-fork dry-run result without sharing secrets.
title: "[Fork trial] "
labels:
  - documentation
  - question
body:
  - type: markdown
    attributes:
      value: |
        Share a real fork setup or dry-run result that maintainers can verify.

        Do not include API keys, Discord webhook URLs, GitHub tokens, private Discord screenshots, invite links, private repository links, or personal identifiers.

        Adoption evidence policy:
        https://github.com/stdiodh/career-feed/blob/main/docs/en/project/adoption-evidence.md
  - type: dropdown
    id: repository-state
    attributes:
      label: Repository state
      options:
        - fresh fork
        - existing fork
        - local clone only
        - other
    validations:
      required: true
  - type: dropdown
    id: guide-used
    attributes:
      label: Guide used
      options:
        - Fresh Fork Smoke Test
        - Fork Setup Guide
        - Runtime Configuration
        - other
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options:
        - ko-KR
        - en-US
        - both
        - unknown
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Backend Daily Brief
        - Dev News Daily
        - Backend Career Site Radar
        - Mark PS Solved
        - Local validation
        - Other
    validations:
      required: true
  - type: input
    id: run-settings
    attributes:
      label: Run settings
      placeholder: dry_run=true, force_send=false, delivery_enabled=false
    validations:
      required: true
  - type: textarea
    id: artifact-paths
    attributes:
      label: Artifact paths checked
      description: List generated report, ops, and candidate paths. Do not paste secret values.
      placeholder: |
        reports/briefs/ko-KR/backend-daily.md
        reports/ops/ko-KR/backend-daily-validation-report.md
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - dry-run succeeded and artifacts were reviewed
        - validation failed and report was reviewed
        - blocked before workflow run
        - blocked by missing or unclear setup
        - other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What worked or was confusing?
      description: Describe the useful or confusing parts of the trial. Keep it public and redacted.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and citation
      options:
        - label: I removed API keys, webhook URLs, tokens, private links, private Discord screenshots, and personal identifiers.
          required: true
        - label: Maintainers may summarize this public issue in docs or application material without naming private people or groups.
          required: false
