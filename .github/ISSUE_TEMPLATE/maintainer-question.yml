name: 기타 maintainer 질문
description: 기존 템플릿에 맞지 않는 작은 질문이나 분류 요청을 남깁니다.
title: "[질문] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        기존 템플릿에 맞지 않는 질문만 이 폼을 사용해 주세요.

        버그, 문서 개선, 출처 제안, OSS 후보, 검증 fixture, 릴리스 준비, 지역/언어 확장은 전용 템플릿을 사용해 주세요.
  - type: textarea
    id: question
    attributes:
      label: 질문
      description: maintainer에게 확인하고 싶은 내용을 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: closest-area
    attributes:
      label: 가장 가까운 영역
      options:
        - setup or fork usage
        - documentation
        - validation
        - source policy
        - OSS candidate policy
        - release or maintenance
        - other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 배경
      description: 관련 문서, workflow, issue가 있다면 적어 주세요. 민감 정보는 제거해 주세요.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 안전 확인
      options:
        - label: secret, webhook URL, private Discord 정보, 개인 식별자를 포함하지 않았습니다.
          required: true
