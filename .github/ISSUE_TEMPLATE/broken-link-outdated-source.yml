name: 깨진 링크 또는 오래된 출처
description: 문서, 설정, 예시의 깨진 링크나 오래된 공개 출처를 신고합니다.
title: "[출처 점검] "
labels:
  - source
  - bug
body:
  - type: markdown
    attributes:
      value: |
        깨진 링크나 오래된 출처를 알려 주세요.

        secret, token, Discord webhook URL, private Discord 정보, 개인 식별자는 포함하지 마세요.
  - type: input
    id: affected-url
    attributes:
      label: 문제가 있는 URL 또는 파일
      description: 깨진 링크, 오래된 출처, 또는 관련 문서 경로를 적어 주세요.
      placeholder: 예) docs/kr/getting-started/fork-setup.md 또는 https://example.com
    validations:
      required: true
  - type: dropdown
    id: issue-type
    attributes:
      label: 문제 유형
      options:
        - 깨진 링크
        - 오래된 출처
        - 접근 제한 또는 로그인 필요
        - 중복 또는 더 이상 관련 없는 출처
        - 기타
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 확인한 내용
      description: 어떤 동작이나 내용을 확인했는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: replacement
    attributes:
      label: 대체 출처 또는 수정 제안
      description: 가능하면 공개적으로 확인 가능한 대체 URL이나 수정 방향을 적어 주세요.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 안전 확인
      options:
        - label: private link, secret, webhook URL, 개인 식별자를 포함하지 않았습니다.
          required: true
        - label: 가능하면 공개 브라우저에서 접근 여부를 확인했습니다.
          required: false
