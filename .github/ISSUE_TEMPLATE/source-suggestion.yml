name: 정보 출처 제안
description: 백엔드 학습, 커리어, 채용, 대외활동 관련 정보 출처를 제안합니다.
title: "[출처 제안] "
labels:
  - source
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Career Feed에 추가하면 좋을 정보 출처를 제안해 주세요.

        공개적으로 확인 가능한 출처를 우선합니다.

        좋은 제안 기준:
        https://github.com/stdiodh/career-feed/blob/main/docs/kr/contributing/source-suggestion-guide.md
  - type: input
    id: source-url
    attributes:
      label: 추천하는 정보 출처
      description: URL을 적어 주세요.
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: source-type
    attributes:
      label: 어떤 정보를 제공하나요?
      description: 채용, 인턴, 대외활동, 기술 블로그, 학습 자료, 뉴스 등으로 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: 왜 백엔드 지망생에게 도움이 되나요?
      description: 이 출처가 어떤 문제를 줄여 주는지 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: reliability
    attributes:
      label: 출처 성격
      options:
        - 공식 문서 또는 공식 채널
        - 회사 기술 블로그
        - 공개 커뮤니티 또는 뉴스레터
        - 채용/인턴/대외활동 공고 사이트
        - 기타
    validations:
      required: true
  - type: input
    id: update-cadence
    attributes:
      label: 업데이트 빈도
      placeholder: 예) daily, weekly, irregular
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 주의할 점
      description: paywall, 로그인 필요 여부, scraping 제한, 광고성 여부, 중복 가능성 등을 적어 주세요.
    validations:
      required: false
