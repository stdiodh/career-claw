name: 백엔드 커리어 질문
description: 백엔드 학습이나 커리어 준비에서 막막한 점을 공유합니다.
title: "[질문] "
body:
  - type: textarea
    id: current-situation
    attributes:
      label: 현재 상황
      description: 현재 학습 단계, 경험, 준비 중인 목표를 적어 주세요.
      placeholder: 예) Java 문법을 공부했고 Spring Boot 프로젝트를 시작하려는 단계입니다.
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: 가장 막막한 점
      description: 어디서 막혔는지, 무엇을 결정하기 어려운지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: desired-help
    attributes:
      label: 원하는 도움
      description: 로드맵, 자료 추천, 실무 주제, 커리어 정보 등 원하는 도움을 적어 주세요.
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: 관심 기술 스택
      placeholder: 예) Java, Spring Boot, MySQL, Redis, AWS
    validations:
      required: false
