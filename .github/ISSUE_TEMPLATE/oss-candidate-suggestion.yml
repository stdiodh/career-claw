name: OSS 기여 후보 제안
description: 백엔드 지망생이 살펴볼 만한 오픈소스 저장소나 이슈를 제안합니다.
title: "[OSS 후보] "
labels:
  - oss-candidate
  - good-first-issue
body:
  - type: markdown
    attributes:
      value: |
        백엔드 지망생이나 주니어 개발자가 살펴볼 만한 OSS 저장소 또는 이슈를 제안해 주세요.

        Career Feed는 외부 저장소에 자동 댓글, PR, assign, label 변경을 하지 않고 후보 추천만 합니다.

        추천 기준은 OSS Candidate Policy를 따릅니다:
        https://github.com/stdiodh/career-feed/blob/main/docs/policies/oss-candidate-policy.md
  - type: input
    id: repository-url
    attributes:
      label: 추천 OSS 저장소 URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: issue-url
    attributes:
      label: 관련 issue URL
      description: good first issue 또는 beginner-friendly issue가 있다면 적어 주세요.
      placeholder: https://github.com/owner/repository/issues/1
    validations:
      required: false
  - type: input
    id: issue-created-at
    attributes:
      label: issue created_at
      description: 관련 issue URL을 적었다면 GitHub에 표시된 생성일 또는 API created_at을 적어 주세요.
      placeholder: 예) 2026-06-01 또는 2026-06-01T12:00:00Z
    validations:
      required: false
  - type: dropdown
    id: beginner-friendly
    attributes:
      label: 초보자 친화적인가요?
      options:
        - 예
        - 아니오
        - 잘 모르겠습니다
    validations:
      required: true
  - type: checkboxes
    id: recency-check
    attributes:
      label: issue 최근성 확인
      description: 관련 issue URL을 적었다면 확인해 주세요.
      options:
        - label: 관련 issue가 최근 30일 이내 created_at 기준으로 생성되었거나, 오래된 issue라면 그 이유를 주의할 점에 적었습니다.
          required: false
        - label: assignee가 없음을 확인했습니다.
          required: false
        - label: linked PR 또는 linked branch가 없음을 확인했습니다.
          required: false
        - label: maintainer claim/comment나 다른 contributor의 작업 선언이 없음을 확인했습니다.
          required: false
  - type: textarea
    id: backend-relevance
    attributes:
      label: 백엔드 학습과의 관련성
      description: 이 저장소나 이슈가 백엔드 학습에 왜 도움이 되는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: cautions
    attributes:
      label: 주의할 점
      description: 난이도, 빌드 환경, 언어, 응답 속도, 기여 가이드 유무 등을 적어 주세요.
    validations:
      required: false
