name: 검증 fixture 제안
description: validator 정책을 설명하거나 보강할 작은 fixture를 제안합니다.
title: "[검증 fixture] "
labels:
  - validation fixture
  - good first issue
body:
  - type: markdown
    attributes:
      value: |
        하나의 검증 규칙을 설명하는 작은 fixture를 제안해 주세요.

        실제 secret, webhook URL, private Discord 정보, 개인 식별자는 포함하지 마세요.
  - type: dropdown
    id: validator-area
    attributes:
      label: 관련 검증 영역
      options:
        - Daily Backend Brief
        - Dev News Daily
        - Backend Career Site Radar
        - OSS candidate reliability
        - documentation or link validation
        - other
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: 검증하려는 규칙
      description: 어떤 입력이 통과하거나 실패해야 하는지 한 가지 규칙만 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 예시 입력 또는 fixture 아이디어
      description: 가능한 한 작은 Markdown 또는 JSON 예시를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 기대 결과
      description: 통과해야 하는지, 실패해야 하는지, 어떤 메시지가 도움이 되는지 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 범위 확인
      options:
        - label: 이 제안은 하나의 검증 규칙에 집중합니다.
          required: true
        - label: secret이나 private identifier를 포함하지 않았습니다.
          required: true
