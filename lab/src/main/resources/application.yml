spring:
  application:
    name: career-feed-backend-lab
  datasource:
    url: jdbc:h2:mem:career-lab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

lab:
  external:
    api-token: ${LAB_EXTERNAL_API_TOKEN:}
    response-timeout: 500ms
    max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash
